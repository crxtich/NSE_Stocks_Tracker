<!doctype html>
<html lang="en">
  <head>
    <!-- Runs before first paint so there's no flash of the wrong theme: reads
         the saved preference (or falls back to OS preference), applies the
         `dark` class synchronously (the same class ThemeToggle manages
         later), and sets the mobile browser-chrome color to match. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
          document.addEventListener('DOMContentLoaded', function () {
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', dark ? '#0B0D10' : '#F7F8FA')
          })
        } catch (e) {}
      })()
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0D10" />
    <meta
      name="description"
      content="Live Nairobi Securities Exchange price data and quantitative market signals — updated automatically throughout the trading day."
    />
    <title>NSE Market Intelligence</title>

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nse-tracker.crotich.com/" />
    <meta property="og:title" content="NSE Market Intelligence" />
    <meta
      property="og:description"
      content="Live Nairobi Securities Exchange price data and quantitative market signals — updated automatically throughout the trading day."
    />
    <meta property="og:image" content="https://nse-tracker.crotich.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NSE Market Intelligence" />
    <meta
      name="twitter:description"
      content="Live Nairobi Securities Exchange price data and quantitative market signals — updated automatically throughout the trading day."
    />
    <meta name="twitter:image" content="https://nse-tracker.crotich.com/og-image.png" />
  </head>
  <body class="bg-canvas text-ink font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
