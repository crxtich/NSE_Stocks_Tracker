# One-time step in moving nse-tracker.dukaribu.com's deploy pipeline from
# khalilaj/nse-tracker to this repo. Generates a NEW deploy key and webhook
# secret on the server itself — the private key never leaves the server and
# never appears in this workflow's log; only the public key and the new
# webhook secret (needed to configure GitHub's side) are printed.
#
# This does not change anything live yet: the existing origin remote and
# webhook keep working exactly as before until the follow-up step
# (cutover-step2-switch-origin.yml) runs, after the values this step prints
# have been added on GitHub's side.
name: Cutover step 1 - generate credentials (no live change)

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Generate new deploy key and webhook secret on the server
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa "$AWS_USER@$AWS_HOST" 'bash -s' <<'REMOTE'
            set -e
            SSH_DIR=/var/www/nse-tracker/.ssh
            NEW_KEY="$SSH_DIR/id_ed25519_crxtich"

            if [ -f "$NEW_KEY" ]; then
              echo "Key already exists at $NEW_KEY - not overwriting. Delete it first if you want a fresh one."
            else
              sudo -n -u www-data ssh-keygen -t ed25519 -f "$NEW_KEY" -C "crxtich-nse-tracker-deploy" -N ""
              echo "Generated new deploy key."
            fi

            echo
            echo "=== PUBLIC KEY (add as a Deploy Key on crxtich/NSE_Stocks_Tracker, read-only) ==="
            sudo -n cat "$NEW_KEY.pub"
            echo

            echo "=== NEW WEBHOOK SECRET (use when adding the webhook on crxtich/NSE_Stocks_Tracker) ==="
            NEW_SECRET=$(openssl rand -hex 32)
            echo "$NEW_SECRET"
            echo "$NEW_SECRET" | sudo -n tee /var/www/nse-tracker/.new_webhook_secret > /dev/null
            sudo -n chown www-data:www-data /var/www/nse-tracker/.new_webhook_secret
            sudo -n chmod 600 /var/www/nse-tracker/.new_webhook_secret
            echo "(saved to /var/www/nse-tracker/.new_webhook_secret for step 2 to pick up)"
          REMOTE

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_rsa
