# Read-only look at the Dukaribu AWS box before anything gets installed on
# it. Runs nothing destructive — just reports what's already there, since
# the server is shared with other projects. Trigger manually from the
# Actions tab (or via the API) once the AWS_SSH_KEY / AWS_HOST / AWS_USER
# secrets are set.
name: Server Diagnostics (read-only)

on:
  workflow_dispatch: {}

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Dump nse_db schema
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa "$AWS_USER@$AWS_HOST" 'bash -s' <<'REMOTE'
            set +e
            for t in newsletter_subscribers price_snapshots watchlist; do
              echo "##### TABLE: $t #####"
              sudo -n -u postgres psql -d nse_db -c "\d $t" 2>&1
            done
            echo "##### VIEW: newsletter_subscriber_count #####"
            sudo -n -u postgres psql -d nse_db -c "\d+ newsletter_subscriber_count" 2>&1
            echo "##### env keys present in api/.env (names only, not values) #####"
            sudo -n grep -o '^[A-Z_]*=' /var/www/nse-tracker/api/.env 2>&1
          REMOTE

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_rsa
