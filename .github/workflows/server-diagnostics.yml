# Read-only look at the Dukaribu AWS box before anything gets installed on
# it. Runs nothing destructive — just reports what's already there, since
# the server is shared with other projects. Trigger manually from the
# Actions tab (or via the API) once the AWS_SSH_KEY / AWS_HOST / AWS_USER
# secrets are set.
name: Server Diagnostics (read-only)

on:
  workflow_dispatch: {}

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Get the real git remote URL
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa "$AWS_USER@$AWS_HOST" 'bash -s' <<'REMOTE'
            set +e
            SAFE="-c safe.directory=/var/www/nse-tracker/src"
            echo "=== git remote for /var/www/nse-tracker/src ==="
            sudo -n git $SAFE -C /var/www/nse-tracker/src remote -v 2>&1
            echo
            echo "=== recent commits ==="
            sudo -n git $SAFE -C /var/www/nse-tracker/src log -8 --oneline 2>&1
            echo
            echo "=== directory owner ==="
            sudo -n stat -c '%U:%G %n' /var/www/nse-tracker/src 2>&1
          REMOTE

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_rsa
