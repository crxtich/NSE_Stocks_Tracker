# Read-only look at the Dukaribu AWS box before anything gets installed on
# it. Runs nothing destructive — just reports what's already there, since
# the server is shared with other projects. Trigger manually from the
# Actions tab (or via the API) once the AWS_SSH_KEY / AWS_HOST / AWS_USER
# secrets are set.
name: Server Diagnostics (read-only)

on:
  workflow_dispatch: {}

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Inspect existing nse-tracker setup
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa "$AWS_USER@$AWS_HOST" 'bash -s' <<'REMOTE'
            set +e
            echo "=== nginx: nse-tracker.dukaribu.com ==="
            sudo -n cat /etc/nginx/sites-available/nse-tracker.dukaribu.com 2>&1
            echo
            echo "=== nginx: nse.dukaribu.com ==="
            sudo -n cat /etc/nginx/sites-available/nse.dukaribu.com 2>&1
            echo
            echo "=== nse-webhook.service unit file ==="
            systemctl cat nse-webhook.service 2>&1
            echo
            echo "=== nse-webhook.service recent logs ==="
            sudo -n journalctl -u nse-webhook.service --no-pager -n 50 2>&1
            echo
            echo "=== pm2 process list ==="
            pm2 ls 2>&1
            echo
            echo "=== crontab (ubuntu user) ==="
            crontab -l 2>&1
            echo
            echo "=== search for nse-related directories ==="
            find /home /var/www /opt /srv -maxdepth 4 -iname "*nse*" 2>/dev/null
            echo
            echo "=== existing postgres databases ==="
            sudo -n -u postgres psql -c "\l" 2>&1
          REMOTE

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_rsa
