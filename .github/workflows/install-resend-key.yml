# One-off: installs RESEND_API_KEY into api/.env on the server and restarts
# the API. The key is supplied at trigger time (workflow_dispatch input),
# never written into this file, and piped directly into a remote file over
# SSH stdin rather than passed as a command-line argument anywhere, so it
# never appears as a literal value in a run: command.
name: Install Resend API key

on:
  workflow_dispatch:
    inputs:
      resend_api_key:
        description: 'Resend API key (re_...)'
        required: true
        type: string

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Mask the key in all subsequent log output
        run: echo "::add-mask::${{ inputs.resend_api_key }}"

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Install the key and restart the API
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          RESEND_KEY: ${{ inputs.resend_api_key }}
        run: |
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa $AWS_USER@$AWS_HOST"

          # Piped via stdin, never a command-line argument or echoed value.
          printf '%s' "$RESEND_KEY" | $SSH 'cat > /tmp/.resend_key_value && chmod 600 /tmp/.resend_key_value'

          $SSH 'cat > /tmp/set-resend-key.sh' <<'REMOTE'
            set -e
            ENV_FILE=/var/www/nse-tracker/api/.env
            sudo -n test -f "$ENV_FILE"
            sudo -n sed -i '/^RESEND_API_KEY=/d' "$ENV_FILE"
            printf 'RESEND_API_KEY=' | sudo -n tee -a "$ENV_FILE" > /dev/null
            sudo -n bash -c 'cat /tmp/.resend_key_value >> '"$ENV_FILE"
            printf '\n' | sudo -n tee -a "$ENV_FILE" > /dev/null
            sudo -n chown www-data:www-data "$ENV_FILE"
            sudo -n chmod 600 "$ENV_FILE"
            rm -f /tmp/.resend_key_value
            echo "RESEND_API_KEY installed."

            sudo -n -u www-data pm2 restart nse-tracker-api --update-env
            sleep 2
            curl -fsS http://127.0.0.1:3015/health && echo
            echo "OK: api restarted and healthy."
          REMOTE

          $SSH 'bash /tmp/set-resend-key.sh < /dev/null; rm -f /tmp/set-resend-key.sh /tmp/.resend_key_value'

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_rsa
