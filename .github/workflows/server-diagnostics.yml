# Read-only look at the Dukaribu AWS box before anything gets installed on
# it. Runs nothing destructive — just reports what's already there, since
# the server is shared with other projects. Trigger manually from the
# Actions tab (or via the API) once the AWS_SSH_KEY / AWS_HOST / AWS_USER
# secrets are set.
name: Server Diagnostics (read-only)

on:
  workflow_dispatch: {}

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Locate collaborator's nse-tracker source
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa "$AWS_USER@$AWS_HOST" 'bash -s' <<'REMOTE'
            set +e
            echo "=== /var/www/nse-tracker top-level layout ==="
            sudo -n find /var/www/nse-tracker -maxdepth 2 -not -path "*/node_modules*" 2>&1
            echo
            echo "=== git remote (if /var/www/nse-tracker is a checkout) ==="
            sudo -n git -C /var/www/nse-tracker remote -v 2>&1
            sudo -n git -C /var/www/nse-tracker log -1 --oneline 2>&1
            echo
            echo "=== git remote (if the api/ subdir is its own checkout) ==="
            sudo -n git -C /var/www/nse-tracker/api remote -v 2>&1
            sudo -n git -C /var/www/nse-tracker/deploy remote -v 2>&1
            echo
            echo "=== deploy script contents ==="
            sudo -n find /var/www/nse-tracker/deploy -maxdepth 1 -type f 2>&1
            for f in /var/www/nse-tracker/deploy/*.mjs /var/www/nse-tracker/deploy/*.sh; do
              echo "--- $f ---"
              sudo -n cat "$f" 2>&1
            done
            echo
            echo "=== pm2 process env for nse-tracker-api (as www-data) ==="
            sudo -n -u www-data pm2 describe nse-tracker-api 2>&1
            echo
            echo "=== www-data's pm2 process list ==="
            sudo -n -u www-data pm2 ls 2>&1
          REMOTE

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_rsa
